services:
  - type: web
    name: petiscaria-pdv
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_HOURS
        value: 12
      - key: TRUST_PROXY
        value: 0
